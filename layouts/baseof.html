<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title | default site.Title }} · {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ if .IsPage }}{{ .Summary | plainify | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="color-scheme" content="light dark"><link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ .Title | default site.Title }}"><meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}"><meta property="og:url" content="{{ .Permalink }}">
  <link rel="alternate" type="application/rss+xml" title="w3iz3n RSS" href="{{ "index.xml" | relURL }}">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
  <script defer src="{{ "site.js" | relURL }}"></script>
  {{ if .IsPage }}
  <script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']],processEscapes:true},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']},loader:{load:['ui/safe']}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>
  {{ end }}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="header wrap"><a class="wordmark" href="{{ site.Home.RelPermalink }}">w3iz3n<span class="dot">.</span></a><nav aria-label="Main navigation"><a href="{{ "posts/" | relURL }}">Writing</a><a href="{{ "docs/" | relURL }}">Notes</a><a href="{{ "about/" | relURL }}">About</a><button id="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">◐</button></nav></header>
  <main id="main" class="wrap">{{ block "main" . }}{{ end }}</main>
  <footer class="footer wrap"><span>© {{ now.Year }} w3iz3n · Stay curious. Keep writing.</span><div><a href="{{ "index.xml" | relURL }}">RSS ↗</a><a href="https://github.com/w3iz3n">GitHub ↗</a><a href="#">Back to top ↑</a></div></footer>
</body>
</html>
