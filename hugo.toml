baseURL = 'https://w3iz3n.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = 'w3iz3n'
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 90
[params]
description = '关于密码学、安全与计算机科学的思考和笔记。'
[outputs]
home = ['HTML', 'RSS']
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]
[markup.highlight]
style = 'github-dark'
lineNos = false
[markup.tableOfContents]
startLevel = 2
endLevel = 3
