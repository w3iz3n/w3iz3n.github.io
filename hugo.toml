baseURL = 'https://w3iz3n.github.io/'
locale = 'en-US'
defaultContentLanguage = 'en'
title = 'w3iz3n'
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 90
[params]
description = 'Thoughts and notes on cryptography, security, and computer science.'
[outputs]
home = ['HTML', 'RSS']
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]
[markup.highlight]
style = 'github-dark'
lineNos = false
[markup.tableOfContents]
startLevel = 2
endLevel = 3
